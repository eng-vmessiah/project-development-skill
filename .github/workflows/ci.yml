name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pyyaml
    
    - name: Run tests
      run: |
        pytest tests/ -v
  
  validate-skills:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Validate skills
      run: |
        chmod +x scripts/validate.sh
        ./scripts/validate.sh
  
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    
    - name: Lint Python code
      run: |
        flake8 scripts/ --max-line-length=100 --ignore=E501,W503
  
  docs:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check documentation
      run: |
        # Check all skills have required sections
        for skill in skills/*/SKILL.md; do
          echo "Checking $skill..."
          
          # Check for overview
          if ! grep -q "## Overview\|# " "$skill"; then
            echo "❌ Missing overview in $skill"
            exit 1
          fi
          
          # Check for when to use
          if ! grep -q "## When to Use" "$skill"; then
            echo "❌ Missing 'When to Use' in $skill"
            exit 1
          fi
          
          echo "✅ $skill is valid"
        done
        
        echo "✅ All documentation is valid"
