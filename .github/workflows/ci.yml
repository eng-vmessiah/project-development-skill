name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pyyaml
    
    - name: Run tests with coverage
      run: |
        pytest tests/ -v --tb=short --junitxml=test-results-${{ matrix.python-version }}.xml --cov=scripts --cov-report=xml:coverage-${{ matrix.python-version }}.xml
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          test-results-${{ matrix.python-version }}.xml
          coverage-${{ matrix.python-version }}.xml
        retention-days: 30
  
  validate-skills:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Validate skills
      run: |
        # Check all skills have required sections
        echo "Validating skill files..."
        FAILED=0
        
        for skill in skills/*/SKILL.md; do
          echo -n "Checking $skill... "
          
          # Check for overview
          if ! grep -q "## Overview\|# " "$skill"; then
            echo "❌ Missing overview"
            FAILED=1
            continue
          fi
          
          # Check for when to use
          if ! grep -q "## When to Use\|# When to Use" "$skill"; then
            echo "❌ Missing 'When to Use'"
            FAILED=1
            continue
          fi
          
          echo "✅"
        done
        
        if [ $FAILED -eq 1 ]; then
          echo "❌ Skill validation failed"
          exit 1
        fi
        
        echo "✅ All skills validated"
    
    - name: Check skill sizes
      run: |
        echo "Skill file sizes:"
        for skill in skills/*/SKILL.md; do
          SIZE=$(wc -c < "$skill")
          NAME=$(basename $(dirname "$skill"))
          printf "  %-35s %6d bytes\n" "$NAME" "$SIZE"
        done
        
        # Warn if any skill exceeds 20KB
        LARGE=$(find skills -name "SKILL.md" -size +20k)
        if [ -n "$LARGE" ]; then
          echo ""
          echo "⚠️  Warning: Large skill files detected:"
          echo "$LARGE"
        fi
  
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    
    - name: Lint Python code
      run: |
        # Correctness-focused contract: syntax (E9), undefined names (F82),
        # and unused imports/locals (F401/F841) are enforced. Legacy style
        # diagnostics are intentionally outside this contract; see .flake8.
        flake8 scripts/ --config=.flake8
  
  docs:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate documentation
      run: |
        # Check required files exist
        REQUIRED_FILES="README.md CONTRIBUTING.md CHANGELOG.md LICENSE ROADMAP.md"
        
        echo "Checking required documentation files..."
        for file in $REQUIRED_FILES; do
          if [ -f "$file" ]; then
            echo "  ✅ $file"
          else
            echo "  ❌ $file (missing)"
            exit 1
          fi
        done
        
        # Check README has skill table
        if grep -q "| Skill |" README.md; then
          echo "  ✅ README.md has skill table"
        else
          echo "  ❌ README.md missing skill table"
          exit 1
        fi
        
        echo "✅ Documentation validated"
