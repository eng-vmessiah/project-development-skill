name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify tag matches VERSION
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$RELEASE_TAG" = "v$version" || {
            echo "Tag $RELEASE_TAG does not match VERSION $version" >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test and lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml flake8

      - name: Run canonical tests
        run: pytest tests/ -v --tb=short

      - name: Run canonical validator and installer checks
        run: |
          ./scripts/validate.sh
          bash tests/test_validate.sh
          bash tests/test_install.sh
          bash tests/test_release.sh

      - name: Check shell syntax
        run: find scripts tests -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Check tracked Markdown relative links
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          root = Path.cwd().resolve()
          files = [Path(item) for item in subprocess.check_output(
              ['git', 'ls-files', '-z', '--', '*.md']
          ).decode().split('\0') if item]
          link_re = re.compile(r'!?\[[^]]*\]\(([^)\n]+)\)')
          heading_re = re.compile(r'^\s*#{1,6}\s+(.+?)\s*#*\s*$', re.MULTILINE)

          def slug(value):
              value = re.sub(r'<[^>]+>', '', value).strip().lower()
              value = re.sub(r'[^\w\s-]', '', value)
              return re.sub(r'[-\s]+', '-', value).strip('-')

          failures = []
          for source in sorted(files, key=lambda path: path.as_posix()):
              text = (root / source).read_text(encoding='utf-8')
              for raw in link_re.findall(text):
                  target = raw.strip().split()[0].strip('<>')
                  if (not target or target.startswith(('#', '/')) or
                          target.startswith(('mailto:', '//')) or
                          re.match(r'^[A-Za-z][A-Za-z0-9+.-]*://', target)):
                      continue
                  target_path, _, fragment = target.partition('#')
                  destination = root / source if not target_path else (root / source).parent / target_path
                  try:
                      destination = destination.resolve()
                      destination.relative_to(root)
                  except ValueError:
                      failures.append(f'{source}: escapes repository: {target}')
                      continue
                  if not destination.exists():
                      failures.append(f'{source}: missing target: {target}')
                      continue
                  if fragment and destination.is_file() and destination.suffix.lower() == '.md':
                      headings = {slug(match.group(1)) for match in heading_re.finditer(destination.read_text(encoding='utf-8'))}
                      if slug(fragment) not in headings:
                          failures.append(f'{source}: missing anchor: {target}')
          if failures:
              print('\n'.join(sorted(failures)))
              raise SystemExit(1)
          print(f'Markdown relative-link check: PASS ({len(files)} tracked files)')
          PY

      - name: Check V2 documentation paths
        run: python scripts/pd_fleet/v2_doc_paths.py .

      - name: Lint Python code
        run: flake8 scripts/ --config=.flake8

      - name: Validate release documentation
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test -s VERSION
          for file in README.md CONTRIBUTING.md CHANGELOG.md LICENSE ROADMAP.md; do test -f "$file"; done
          grep -Fq "## [$version]" CHANGELOG.md
          grep -q '| Skill |' README.md

      - name: Build source archive and checksum
        run: bash scripts/create-source-archive.sh "$GITHUB_REF_NAME" dist

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          heading="## [$version]"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Project Development Skills $version" \
            --notes-file <(awk -v heading="$heading" '$0 == heading {found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md)
